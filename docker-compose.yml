services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "5000"
    # Default is loopback behind Caddy; GATEWAY_BIND_ADDRESS=0.0.0.0 enables direct, unencrypted HTTP.
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    networks:
      - gateway-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gateway-internal
    security_opt:
      - no-new-privileges:true

networks:
  gateway-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
